<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15151a">
<title>Ball Sort Puzzle · Color Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='10' cy='11' r='7' fill='%231f9ce8'/><circle cx='22' cy='21' r='7' fill='%23f08000'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- the animated backdrop every screen sits on -->
<div id="bg"><i></i><i></i><i></i><i></i><i></i></div>

<div id="app">

  <!-- ═══════════════════════════ HOME ═══════════════════════════ -->
  <section id="screenHome" class="screen">
    <div class="wallet" data-wallet><b>🪙</b><span class="coinNum">0</span></div>

    <div class="homeTop">
      <div class="logoTubes" aria-hidden="true">
        <i style="--c1:#1f9ce8;--c2:#d4141c;--c3:#4ddc10;--c4:#f08000"></i>
        <i style="--c1:#e8de10;--c2:#8b2fd6;--c3:#ff8ec4;--c4:#14c8c0"></i>
        <i style="--c1:#4ddc10;--c2:#1f9ce8;--c3:#f08000;--c4:#d4141c"></i>
      </div>
      <h1 class="logo"><span>BALL</span> SORT<em>color puzzle</em></h1>
    </div>

    <div class="homeMid">
      <div class="progressCard">
        <div class="pcRow">
          <span class="pcLabel">Đang ở</span>
          <b class="pcLevel" id="homeLevel">Cấp độ 1</b>
        </div>
        <div class="pcBar"><i id="homeBar"></i></div>
        <div class="pcRow small">
          <span id="homeCleared">0 màn đã qua</span>
          <span id="homeStars">★ 0</span>
        </div>
      </div>

      <button class="playBtn" id="btnPlay"><span>CHƠI</span></button>

      <div class="homeRow">
        <button class="homeBtn" id="btnLevels"><b>🗺️</b><span>Chọn màn</span></button>
        <button class="homeBtn" id="btnDaily"><b>🎁</b><span>Quà ngày</span><i class="dot" id="dailyDot"></i></button>
        <button class="homeBtn" id="btnShop"><b>🛒</b><span>Cửa hàng</span></button>
        <button class="homeBtn" id="btnSettings"><b>⚙️</b><span>Cài đặt</span></button>
      </div>
    </div>

    <div class="modeSwitch" id="homeMode">
      <button class="mode active" data-mode="classic">Cổ điển</button>
      <button class="mode" data-mode="hard">Khó</button>
    </div>
  </section>

  <!-- ══════════════════════════ LEVELS ══════════════════════════ -->
  <section id="screenLevels" class="screen">
    <header class="bar">
      <button class="ic" data-back>‹</button>
      <div class="barTitle">Chọn màn</div>
      <div class="spacer"></div>
      <div class="wallet" data-wallet><b>🪙</b><span class="coinNum">0</span></div>
    </header>

    <div class="lvTools">
      <div class="modeSwitch" id="lvMode">
        <button class="mode active" data-mode="classic">Cổ điển</button>
        <button class="mode" data-mode="hard">Khó</button>
      </div>
      <div class="jump">
        <input id="lvJump" type="number" min="1" inputmode="numeric" placeholder="Tới màn…">
        <button class="btn primary" id="btnJump">Đi</button>
      </div>
    </div>

    <div class="lvPages">
      <button class="ic" id="lvPrev">‹</button>
      <span id="lvRange">1 – 60</span>
      <button class="ic" id="lvNext">›</button>
    </div>

    <div class="lvGrid" id="lvGrid"></div>
  </section>

  <!-- ═══════════════════════════ GAME ═══════════════════════════ -->
  <section id="screenGame" class="screen">
    <header class="bar" id="topbar">
      <button class="ic" data-back>‹</button>
      <div id="levelPill">
        <span class="lbl">Màn</span>
        <span id="levelNum">1</span>
      </div>
      <div class="spacer"></div>
      <div id="moveBox"><span class="lbl">Bước</span> <span id="moveNum">0</span></div>
      <div class="wallet" data-wallet><b>🪙</b><span class="coinNum">0</span></div>
      <button class="ic" id="btnSound" title="Bật/tắt tiếng">🔊</button>
    </header>

    <main id="board">
      <div id="tubes"></div>
      <div id="balls"></div>
      <div id="fx"></div>
      <!-- inside the board so the message and the skip button stay clear of
           the header and the toolbar; the spotlight's shadow is unclipped and
           still dims the whole page -->
      <div id="tutor">
        <i id="tutorSpot"></i>
        <i id="tutorHand">👆</i>
        <button id="tutorSkip">Bỏ qua hướng dẫn</button>
        <p id="tutorMsg"></p>
      </div>
    </main>

    <footer id="toolbar">
      <button class="tool" id="btnUndo"><span class="gl">↺</span><span class="tx">Hoàn tác</span></button>
      <button class="tool" id="btnRestart"><span class="gl">⟳</span><span class="tx">Chơi lại</span></button>
      <button class="tool" id="btnAdd"><span class="gl">＋</span><span class="tx">Thêm ống</span><span class="price" id="priceTube">60</span></button>
      <button class="tool" id="btnHint"><span class="gl">💡</span><span class="tx">Gợi ý</span><span class="price" id="priceHint">20</span></button>
    </footer>
  </section>

</div>

<div id="toast"></div>
<div id="sky"></div>
<div id="coinFly"></div>

<!-- ══════════════════════ LEVEL COMPLETE ══════════════════════ -->
<div id="winOverlay" class="overlay">
  <div class="winPanel">
    <div class="rays"></div>
    <div class="winInner">
      <div class="winLevel" id="winLevel">Cấp độ 1</div>
      <h2 class="winTitle">HOÀN THÀNH!</h2>

      <div class="stars">
        <i class="star" data-i="0">★</i>
        <i class="star mid" data-i="1">★</i>
        <i class="star" data-i="2">★</i>
      </div>

      <div class="praise" id="winPraise">Tuyệt vời!</div>

      <div class="reward" id="winReward"><b>🪙</b><span id="winCoins">+10</span></div>

      <div class="winRow">
        <button class="btn ghost sq" id="btnHome" title="Về trang chính">🏠</button>
        <button class="btn ghost sq" id="btnReplay" title="Chơi lại">↺</button>
        <button class="btn primary grow" id="btnNext"><span>Màn tiếp</span> →</button>
      </div>
    </div>
  </div>
</div>

<!-- ════════════════════════ DAILY REWARD ════════════════════════ -->
<div id="dailyOverlay" class="overlay">
  <div class="panel">
    <h2>Quà mỗi ngày</h2>
    <p class="sub">Vào chơi mỗi ngày để nhận thưởng lớn hơn</p>
    <div class="dayRow" id="dayRow"></div>
    <button class="btn primary wide" id="btnClaim">Nhận thưởng</button>
    <button class="btn ghost wide" data-close>Để sau</button>
  </div>
</div>

<!-- ═══════════════════════════ SHOP ═══════════════════════════ -->
<div id="shopOverlay" class="overlay">
  <div class="panel">
    <h2>Cửa hàng</h2>
    <p class="sub">Ví của bạn: <b class="coinNum" data-wallet>0</b> 🪙</p>
    <div class="shopList" id="shopList"></div>
    <button class="btn ghost wide" data-close>Đóng</button>
  </div>
</div>

<!-- ═════════════════════════ SETTINGS ═════════════════════════ -->
<div id="settingsOverlay" class="overlay">
  <div class="panel">
    <h2>Cài đặt</h2>
    <div class="settings">
      <label class="sw"><span>🔔 Âm thanh</span><input type="checkbox" id="optSfx" checked><i></i></label>
      <label class="sw"><span>🎵 Nhạc nền</span><input type="checkbox" id="optMusic" checked><i></i></label>
    </div>
    <p class="sub tiny" id="setInfo"></p>
    <button class="btn danger wide" id="btnReset">Xoá toàn bộ tiến độ</button>
    <button class="btn ghost wide" data-close>Đóng</button>
  </div>
</div>

<script src="data/levels-classic.js"></script>
<script src="data/levels-hard.js"></script>
<script src="data/par-classic.js"></script>
<script src="data/par-hard.js"></script>
<script src="src/save.js"></script>
<script src="src/board.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
