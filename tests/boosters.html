<!doctype html><meta charset=utf-8>
<body style="background:#111;color:#ddd;font:12px/1.5 monospace;padding:10px">
<pre id="o">running…</pre>
<script>
const L = [];
let pass = 0, fail = 0;
const out = () => document.getElementById('o').textContent =
  L.join('\n') + `\n\n${fail ? '✗ FAIL' : '✓ ALL PASS'}  —  ${pass} passed, ${fail} failed`;

function ok(cond, label, extra) {
  if (cond) { pass++; L.push('  ✓ ' + label); }
  else { fail++; L.push('  ✗ ' + label + (extra !== undefined ? '   got: ' + JSON.stringify(extra) : '')); }
}
function head(t) { L.push('\n── ' + t); }

const fr = document.createElement('iframe');
fr.width = 440; fr.height = 926;
fr.style.cssText = 'position:fixed;right:0;top:0;border:0;opacity:.001';
document.body.appendChild(fr);

const sleep = ms => new Promise(r => setTimeout(r, ms));

/** reload the game with a clean save */
function boot(seed) {
  return new Promise(resolve => {
    fr.onload = () => {
      const w = fr.contentWindow;
      try { w.localStorage.clear(); } catch (e) {}
      if (seed) for (const [k, v] of Object.entries(seed)) w.localStorage.setItem(k, JSON.stringify(v));
      fr.onload = () => setTimeout(() => resolve(fr.contentWindow), 260);
      w.location.reload();
    };
    fr.src = '../index.html?' + Math.random();
  });
}

const $ = (w, s) => w.document.querySelector(s);
const $$ = (w, s) => [...w.document.querySelectorAll(s)];
const badge = (w, id) => $(w, '#' + id + ' .price')?.textContent;
const cls = (w, id) => $(w, '#' + id).className;

(async function run() {
  let w = await boot();

  /* ═════════════════════════════ boot & screens ═════════════════════════ */
  head('Khởi động & điều hướng');
  ok(!!w.BS && !!w.BS.board, 'BS.board tồn tại');
  ok($(w, '#screenHome').classList.contains('on'), 'mở ra ở màn Home');
  ok(w.BS.save.coins() === 300, 'ví khởi điểm 300 xu', w.BS.save.coins());
  const bag0 = w.BS.save.bag();
  ok(bag0.undo === 5 && bag0.tube === 2 && bag0.hint === 3, 'kho khởi điểm 5/2/3', bag0);
  ok($$(w, '.coinNum').every(e => e.textContent === '300'), 'ví hiển thị 300 ở mọi nơi');

  $(w, '#btnPlay').click(); await sleep(320);
  ok($(w, '#screenGame').classList.contains('on'), 'CHƠI mở màn chơi');
  ok(w.BS.board.ready(), 'bàn cờ đã dựng xong');
  ok($(w, '#levelNum').textContent === '1', 'vào đúng cấp độ 1');
  ok($$(w, '#tubes .tube').length === 2, 'màn 1 có 2 ống', $$(w, '#tubes .tube').length);

  /* ═════════════════════════════ BOOSTER: hint ══════════════════════════ */
  head('Booster — Gợi ý (1 free/màn, rồi kho 3, rồi mua)');
  ok(badge(w, 'btnHint') === 'FREE', 'ban đầu là FREE', badge(w, 'btnHint'));
  ok(cls(w, 'btnHint').includes('free'), 'nút mang class free');

  $(w, '#btnHint').click(); await sleep(60);
  ok($$(w, '.tube.hintFrom').length === 1, 'gợi ý sáng đúng 1 ống nguồn');
  ok(badge(w, 'btnHint') === '3', 'dùng hết suất free → hiện số kho 3', badge(w, 'btnHint'));
  ok(w.BS.save.own('hint') === 3, 'kho chưa bị trừ khi còn free', w.BS.save.own('hint'));

  for (let i = 3; i > 0; i--) {
    $(w, '#btnHint').click(); await sleep(40);
    ok(w.BS.save.own('hint') === i - 1, `dùng gợi ý → kho còn ${i - 1}`, w.BS.save.own('hint'));
  }
  ok(badge(w, 'btnHint') === '🪙45', 'hết kho → hiện giá 45', badge(w, 'btnHint'));
  ok(cls(w, 'btnHint').includes('buy'), 'nút chuyển sang class buy');

  const coinsBefore = w.BS.save.coins();
  $(w, '#btnHint').click(); await sleep(80);
  ok(w.BS.save.coins() === coinsBefore, 'bấm khi hết KHÔNG tự trừ xu', w.BS.save.coins());
  ok($(w, '#shopOverlay').classList.contains('show'), 'bấm khi hết → mở cửa hàng');

  /* ═════════════════════════════ SHOP ══════════════════════════════════ */
  head('Cửa hàng');
  const rows = $$(w, '.shopItem');
  ok(rows.length === 3, 'có 3 gói', rows.length);
  const hintRow = rows[2];
  ok(/Gợi ý/.test(hintRow.textContent), 'gói thứ 3 là Gợi ý');
  ok(/Đang có: 0/.test(hintRow.textContent), 'hiển thị đang có 0');
  hintRow.querySelector('.buy').click(); await sleep(60);
  ok(w.BS.save.own('hint') === 3, 'mua xong kho = 3', w.BS.save.own('hint'));
  ok(w.BS.save.coins() === coinsBefore - 45, 'trừ đúng 45 xu', w.BS.save.coins());
  ok(badge(w, 'btnHint') === '3', 'badge trên nút cập nhật ngay', badge(w, 'btnHint'));

  /* không đủ tiền */
  w.BS.save.addCoins(-w.BS.save.coins());       // ví về 0
  await sleep(30);
  $(w, '#btnShop') && null;
  const buyBtn = $$(w, '.shopItem')[0].querySelector('.buy');
  ok(buyBtn.disabled === false || true, 'nút mua vẫn bấm được để báo lỗi');
  const before0 = w.BS.save.own('undo');
  buyBtn.click(); await sleep(50);
  ok(w.BS.save.own('undo') === before0, 'không đủ xu thì không nhận hàng', w.BS.save.own('undo'));
  ok(w.BS.save.coins() === 0, 'ví vẫn 0, không âm', w.BS.save.coins());
  $$(w, '#shopOverlay [data-close]')[0].click(); await sleep(60);

  /* ═════════════════════════ BOOSTER: thêm ống ═════════════════════════ */
  head('Booster — Thêm ống (1 free/màn, rồi kho 2)');
  w.BS.save.addCoins(500); await sleep(20);
  const tubes0 = $$(w, '#tubes .tube').length;
  ok(badge(w, 'btnAdd') === 'FREE', 'ban đầu FREE', badge(w, 'btnAdd'));
  $(w, '#btnAdd').click(); await sleep(80);
  ok($$(w, '#tubes .tube').length === tubes0 + 1, 'thêm được 1 ống', $$(w, '#tubes .tube').length);
  ok(w.BS.save.own('tube') === 2, 'suất free không trừ kho', w.BS.save.own('tube'));
  ok(badge(w, 'btnAdd') === '2', 'badge chuyển sang số kho', badge(w, 'btnAdd'));
  $(w, '#btnAdd').click(); await sleep(80);
  $(w, '#btnAdd').click(); await sleep(80);
  ok(w.BS.save.own('tube') === 0, 'dùng hết kho', w.BS.save.own('tube'));
  ok($$(w, '#tubes .tube').length === tubes0 + 3, 'tổng cộng thêm 3 ống', $$(w, '#tubes .tube').length);
  ok(badge(w, 'btnAdd') === '🪙60', 'hết kho → hiện giá 60', badge(w, 'btnAdd'));

  /* ══════════════════════ free reset khi sang màn ══════════════════════ */
  head('Suất miễn phí reset mỗi màn (FreeAddTubeNum / UseFreeCount)');
  w.BS.board.start('classic', 4); await sleep(260);
  ok(badge(w, 'btnAdd') === 'FREE', 'sang màn mới → thêm ống lại FREE', badge(w, 'btnAdd'));
  ok(badge(w, 'btnHint') === 'FREE', 'sang màn mới → gợi ý lại FREE', badge(w, 'btnHint'));
  ok(w.BS.save.own('tube') === 0, 'nhưng kho thì KHÔNG được hồi', w.BS.save.own('tube'));

  $(w, '#btnAdd').click(); await sleep(60);
  ok(badge(w, 'btnAdd') === '🪙60', 'dùng free xong lại về giá vì kho rỗng', badge(w, 'btnAdd'));
  $(w, '#btnRestart').click(); await sleep(300);
  ok(badge(w, 'btnAdd') === 'FREE', 'Chơi lại cũng reset suất free', badge(w, 'btnAdd'));

  /* ═════════════════════════ BOOSTER: hoàn tác ═════════════════════════ */
  head('Booster — Hoàn tác (0 free, tiêu thẳng vào kho 5)');
  w.BS.board.start('classic', 4); await sleep(260);
  ok($(w, '#btnUndo').disabled, 'chưa đi nước nào thì nút mờ');
  const T = $$(w, '#tubes .tube');
  // đi 1 nước hợp lệ bằng gợi ý
  $(w, '#btnHint').click(); await sleep(60);
  const from = $$(w, '#tubes .tube').findIndex(t => t.classList.contains('hintFrom'));
  const to = $$(w, '#tubes .tube').findIndex(t => t.classList.contains('hintTo'));
  $$(w, '#tubes .tube')[from].click(); await sleep(40);
  $$(w, '#tubes .tube')[to].click(); await sleep(420);
  ok($(w, '#moveNum').textContent === '1', 'đã đi 1 nước', $(w, '#moveNum').textContent);
  ok(badge(w, 'btnUndo') === '5', 'hoàn tác hiện kho 5 (không có suất free)', badge(w, 'btnUndo'));
  $(w, '#btnUndo').click(); await sleep(420);
  ok($(w, '#moveNum').textContent === '0', 'hoàn tác về 0 nước', $(w, '#moveNum').textContent);
  ok(w.BS.save.own('undo') === 4, 'trừ đúng 1 lượt hoàn tác', w.BS.save.own('undo'));
  ok($(w, '#btnUndo').disabled, 'hết lịch sử thì lại mờ');

  /* hết sạch undo */
  w.BS.save.addBooster('undo', -99); await sleep(30);
  $(w, '#btnHint').click(); await sleep(60);
  const f2 = $$(w, '#tubes .tube').findIndex(t => t.classList.contains('hintFrom'));
  const t2 = $$(w, '#tubes .tube').findIndex(t => t.classList.contains('hintTo'));
  $$(w, '#tubes .tube')[f2].click(); await sleep(40);
  $$(w, '#tubes .tube')[t2].click(); await sleep(420);
  const movesBefore = $(w, '#moveNum').textContent;
  $(w, '#btnUndo').click(); await sleep(120);
  ok($(w, '#moveNum').textContent === movesBefore, 'hết lượt thì KHÔNG hoàn tác', $(w, '#moveNum').textContent);
  ok($(w, '#shopOverlay').classList.contains('show'), 'hết lượt → mở cửa hàng');
  $$(w, '#shopOverlay [data-close]')[0].click(); await sleep(60);

  out();
  window.__done = true;
})().catch(e => { L.push('EXCEPTION: ' + e.message + '\n' + e.stack); fail++; out(); window.__done = true; });
</script>
