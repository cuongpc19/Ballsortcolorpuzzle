<!doctype html><meta charset=utf-8>
<body style="background:#111;color:#ddd;font:12px/1.5 monospace;padding:10px">
<pre id="o">running…</pre>
<script>
const L=[];let pass=0,fail=0;
const out=()=>document.getElementById('o').textContent=
  L.join('\n')+`\n\n${fail?'✗ FAIL':'✓ ALL PASS'}  —  ${pass} passed, ${fail} failed`;
function ok(c,l,x){ if(c){pass++;L.push('  ✓ '+l);} else {fail++;L.push('  ✗ '+l+(x!==undefined?'   got: '+JSON.stringify(x):''));} }
function head(t){L.push('\n── '+t);}
const fr=document.createElement('iframe');fr.width=440;fr.height=926;
fr.style.cssText='position:fixed;right:0;top:0;border:0;opacity:.001';
document.body.appendChild(fr);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const $=(w,s)=>w.document.querySelector(s);
const $$=(w,s)=>[...w.document.querySelectorAll(s)];
function boot(seed){return new Promise(res=>{fr.onload=()=>{const w=fr.contentWindow;
  try{w.localStorage.clear();if(seed)for(const[k,v]of Object.entries(seed))w.localStorage.setItem(k,JSON.stringify(v));}catch(e){}
  fr.onload=()=>setTimeout(()=>res(fr.contentWindow),300);w.location.reload();};
  fr.src='../index.html?'+Math.random();});}

(async function(){
  let w = await boot();

  const handX = () => parseFloat($(w,'#tutorHand').style.left);
  const centerOf = i => { const r = w.BS.board.tubeRect(i);
    return r.left - $(w,'#tutor').getBoundingClientRect().left + r.width / 2; };

  head('Màn 1 tự chạy hướng dẫn');
  $(w,'#btnPlay').click(); await sleep(900);
  ok(w.BS.tutorial.active(), 'hướng dẫn đang chạy');
  ok($(w,'#tutor').classList.contains('on'), 'lớp hướng dẫn hiện ra');
  ok($(w,'#tutorHand').classList.contains('on'), 'bàn tay hiện ra ngay');
  ok(!$(w,'#tutorMsg') && !$(w,'#tutorSkip') && !$(w,'#tutorSpot'),
     'không còn hộp chữ, nút bỏ qua hay đèn rọi');

  head('Chỉ vào ống nguồn');
  const mv = w.BS.board.nextMove();
  ok(Math.abs(handX() - centerOf(mv.from)) < 1.5, 'bàn tay đúng ống nguồn',
     [handX(), centerOf(mv.from)]);

  head('Hướng dẫn chỉ gợi ý, không khoá tay người chơi');
  const T=()=>$$(w,'#tubes .tube');
  const hand = () => $(w,'#tutorHand').classList.contains('on');
  const wrong = mv.from===0?1:0;
  T()[wrong].click(); await sleep(120);
  ok($$(w,'.ball.sel').length>0, 'chạm ống khác vẫn nhấc được bi');
  ok(!hand(), 'bàn tay lùi ra khi người chơi tự đi');
  ok(w.BS.tutorial.active(), 'hướng dẫn vẫn chưa tắt');
  T()[wrong].click(); await sleep(120);
  ok($$(w,'.ball.sel').length===0, 'đặt bi xuống được');
  ok(hand(), 'bỏ bi xuống thì bàn tay chỉ lại');
  ok(Math.abs(handX() - centerOf(mv.from)) < 1.5, 'và vẫn đúng ống nguồn');

  head('Chỉ sang ống đích');
  T()[mv.from].click(); await sleep(160);
  ok($$(w,'.ball.sel').length>0, 'chạm đúng ống thì nhấc được bi');
  ok(Math.abs(handX() - centerOf(mv.to)) < 1.5, 'bàn tay nhảy sang ống đích',
     [handX(), centerOf(mv.to)]);

  head('Đi xong thì hướng dẫn tự tắt và không quay lại');
  T()[mv.to].click(); await sleep(500);
  ok(!w.BS.tutorial.active(), 'hướng dẫn đã tắt');
  ok(!$(w,'#tutor').classList.contains('on'), 'lớp hướng dẫn ẩn đi');
  ok(w.BS.save.taughtUpTo() === 1, 'đã ghi nhớ là dạy xong màn 1', w.BS.save.taughtUpTo());
  ok(w.BS.board.moves()===1, 'nước đi được tính bình thường', w.BS.board.moves());

  head('Vào lại màn 1 thì không hiện nữa');
  w.BS.board.start('classic',0); await sleep(900);
  ok(!w.BS.tutorial.active(), 'không chạy lại');

  head('Màn 2 cũng được dạy — mốc là ' + w.BS.GUIDE_LEVELS + ' màn');
  w.BS.save.unlock('classic',2);
  w.BS.board.start('classic',1); await sleep(900);
  ok(w.BS.tutorial.active(), 'màn 2 vẫn chạy hướng dẫn');
  const mv2 = w.BS.board.nextMove();
  const T2b = () => $$(w,'#tubes .tube');
  T2b()[mv2.from].click(); await sleep(80);
  ok($$(w,'.ball.sel').length>0, 'nhấc được bi ở màn 2');
  T2b()[mv2.to].click(); await sleep(520);
  ok(!hand(), 'đi xong nước đầu thì thả tay ra');
  ok(w.BS.save.taughtUpTo() === 2, 'ghi nhớ đã dạy tới màn 2', w.BS.save.taughtUpTo());
  ok(w.BS.board.moves() === 1, 'nước đi được tính bình thường', w.BS.board.moves());

  head('Đứng im thì hướng dẫn chỉ tiếp nước sau');
  ok(w.BS.tutorial.active(), 'hướng dẫn chưa tắt sau nước đầu');
  await sleep(w.BS.GUIDE_IDLE + 400);
  ok(hand(), 'đứng im quá ' + w.BS.GUIDE_IDLE + 'ms thì tay chỉ lại');
  const mv3 = w.BS.board.nextMove();
  ok(Math.abs(handX() - centerOf(mv3.from)) < 1.5, 'chỉ đúng ống của nước tiếp theo',
     [handX(), centerOf(mv3.from)]);
  T2b()[mv3.from].click(); await sleep(80);
  T2b()[mv3.to].click(); await sleep(520);
  ok(w.BS.board.moves() === 2, 'đi theo thì nước thứ hai được tính', w.BS.board.moves());
  ok(!hand(), 'và tay lại thả ra ngay sau đó');

  head('Màn 3 thì thôi');
  w.BS.save.unlock('classic',3);
  w.BS.board.start('classic',2); await sleep(900);
  ok(!w.BS.tutorial.active(), 'màn 3 không dạy nữa');

  head('Khoá cũ ghi true vẫn đọc được là "đã dạy màn 1"');
  w = await boot({bsp_tutor:true});
  ok(w.BS.save.taughtUpTo() === 1, 'true → 1', w.BS.save.taughtUpTo());

  head('Người đã học rồi thì màn 1 vào thẳng');
  w = await boot({bsp_tutor:2});
  $(w,'#btnPlay').click(); await sleep(900);
  ok(!w.BS.tutorial.active(), 'bỏ qua hướng dẫn');
  ok(!$(w,'#tutor').classList.contains('on'), 'không có lớp phủ');
  const T2=$$(w,'#tubes .tube');
  const mv0 = w.BS.board.moves();
  T2[0].click(); await sleep(320);
  /* Không còn bị khoá chạm nữa. Ở màn 1 auto-import đang bật nên một chạm là
     bi đi luôn; nếu tắt nó thì bi được nhấc lên chờ chạm lần hai. Cả hai đều
     là "không bị chặn". */
  ok($$(w,'.ball.sel').length > 0 || w.BS.board.moves() > mv0,
     'chạm ống nào cũng được, không bị chặn',
     { sel: $$(w,'.ball.sel').length, moves: w.BS.board.moves() - mv0 });

  head('Màn khác không có hướng dẫn');
  w = await boot();
  w.BS.save.unlock('classic',6);
  w.BS.board.start('classic',5); await sleep(900);
  ok(!w.BS.tutorial.active(), 'màn 6 không chạy hướng dẫn');
  ok(w.BS.save.taughtUpTo() === 0, 'và không đánh dấu đã dạy', w.BS.save.taughtUpTo());

  out();
})().catch(e=>{L.push('EXCEPTION: '+e.message+'\n'+e.stack);fail++;out();});
</script>
